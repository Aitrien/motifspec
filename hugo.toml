# Read by Hugo when a site imports this repo as a module.
# Declares where this repo's files appear inside the consuming site,
# so the site only needs the import line.

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"

  [[module.mounts]]
    source = "dist"
    target = "assets/motifspec"

  [[module.mounts]]
    source = "fonts"
    target = "static/fonts"

  # Component partials (layouts/_partials/motifspec/) and Markdown render hooks (layouts/_markup/). A site's own
  # file at the same path wins, so a site can override any of them. docs/hugo.md lists them.
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
