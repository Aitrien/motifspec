name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the release check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tokens
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist docs || (echo "::error::dist/ or the generated doc tables are stale. Run npm run build and commit the result." && exit 1)
      - name: Audit showcase
        run: npm run audit
      - name: Release check
        run: npm run release:check
