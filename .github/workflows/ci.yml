name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the release check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies (the MCP server's)
        run: npm ci
      - name: Validate tokens
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist docs || (echo "::error::dist/ or the generated doc tables are stale. Run npm run build and commit the result." && exit 1)
      - name: Audit the stylesheet, scripts and templates
        run: npm run audit
      - name: Release check
        run: npm run release:check
      - name: npm package check
        run: npm run pack:check
      - name: MCP server tests
        run: npm run test:mcp
      - name: MCP server bundle
        run: npm run mcp:bundle && MCP_HANDLER=build/mcp/index.mjs npm run test:mcp

  docs:
    # motifspec.com, built from site/ against this commit's module: every page must build with no warnings, the checker
    # must pass on the site's own templates and content, no link or fragment may be broken, and Lighthouse must score
    # accessibility 100 on the pages R19 in the layouts plan names.
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every file's history, for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hugo extended
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install dev dependencies (Pagefind)
        run: npm ci
      - name: Build the site
        run: npm run docs
      - name: Check the site
        run: npm run docs:check
      - name: Check the site's links and fragments
        run: |
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.20.1/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "${{ runner.temp }}"
          "${{ runner.temp }}/lychee" --offline --include-fragments --index-files index.html --root-dir "$PWD/site/public" --no-progress 'site/public/**/*.html'
      - name: Lighthouse accessibility (100 on the landing page, an article, a component page and the tokens page)
        run: npm run docs:quality
