name: Release

# Runs after CI passes on a push to main. If package.json has a version that isn't tagged yet, it tags the exact
# commit CI checked and publishes a GitHub release with that version's CHANGELOG entry. Otherwise it does nothing.
# Then it publishes that commit to npm. So releasing is: bump the version and add the CHANGELOG entry in a PR, then
# merge it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and release the version in package.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release.mjs --publish

  npm:
    # Publishes the tagged commit to npm with npm trusted publishing: GitHub's OIDC token proves to npm that this run is
    # release.yml in Aitrien/motifspec, so no npm token is stored. Set up once on npmjs.com under the package's
    # Settings → Trusted publisher. Skips a version that is already on npm, so re-running is safe.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@11
      - name: Publish if this commit is the tagged release and npm doesn't have it
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(git rev-list -n 1 "v$version" 2>/dev/null)" != "$(git rev-parse HEAD)" ]; then
            echo "v$version is not this commit, so there is nothing new to publish."
            exit 0
          fi
          if ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name isn't on npm yet. Publish the first version by hand (npm publish --access public), then add this workflow as its trusted publisher; later versions publish here."
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
            exit 0
          fi
          npm publish --provenance --access public
