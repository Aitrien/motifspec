name: Release

# Runs after CI passes on a push to main. If package.json has a version that isn't tagged yet, it tags the exact
# commit CI checked and publishes a GitHub release with that version's CHANGELOG entry. Otherwise it does nothing.
# Then it publishes that commit to npm, deploys it as the MCP server and publishes its docs site at motifspec.com. So
# releasing is: bump the version and add the CHANGELOG entry in a PR, then merge it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run by hand from the Actions tab to retry publishing and deploying: it acts only if main's version tag is main's
  # current commit, and npm skips a version it already has. It never tags.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and release the version in package.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release.mjs --publish
      - name: Is this commit a release?
        id: released
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags --quiet
          version=$(node -p "require('./package.json').version")
          if [ "$(git rev-list -n 1 "v$version" 2>/dev/null)" = "$SHA" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

  npm:
    # Publishes the tagged commit to npm with npm trusted publishing: GitHub's OIDC token proves to npm that this run is
    # release.yml in Aitrien/motifspec, so no npm token is stored. Set up once on npmjs.com under the package's
    # Settings → Trusted publisher. Skips a version that is already on npm, so re-running is safe.
    needs: release
    # After a release, or by hand. A skipped release job (nothing new to tag) doesn't stop it, so a re-run can retry.
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@11
      - name: Publish if this commit is the tagged release and npm doesn't have it
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(git rev-list -n 1 "v$version" 2>/dev/null)" != "$(git rev-parse HEAD)" ]; then
            echo "v$version is not this commit, so there is nothing new to publish."
            exit 0
          fi
          if ! npm view "$name" name >/dev/null 2>&1; then
            echo "::notice::$name isn't on npm yet. Publish the first version by hand (npm publish --access public), then add this workflow as its trusted publisher; later versions publish here."
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
            exit 0
          fi
          # On failure, npm's error lines become annotations on the run, so the reason shows without opening the log.
          set -o pipefail
          if ! npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            grep -E "npm (error|ERR!)" "$RUNNER_TEMP/publish.log" | tail -n 10 | while IFS= read -r line; do echo "::error title=npm publish::$line"; done
            exit 1
          fi

  mcp:
    # Deploys the release as the MCP server at https://mcp.motifspec.com/mcp: the AWS Lambda function in infra/mcp.yml.
    # GitHub's OIDC token assumes the deploy role, which only main can use and which can only replace that function's
    # code, so no AWS key is stored. Changes to infra/mcp.yml itself are applied by hand in CloudFormation.
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE: arn:aws:iam::758354548106:role/motifspec-mcp-deploy
      URL: https://mcp.motifspec.com/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Is this commit a release?
        id: tagged
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list -n 1 "v$version" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not this commit, so there is nothing new to deploy."
          fi
      - uses: actions/setup-node@v4
        if: steps.tagged.outputs.release
        with:
          node-version: 22
      - name: Bundle, and test the bundle
        if: steps.tagged.outputs.release
        run: |
          npm ci
          npm run mcp:bundle
          MCP_HANDLER=build/mcp/index.mjs npm run test:mcp
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.tagged.outputs.release
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to Lambda
        if: steps.tagged.outputs.release
        run: |
          aws lambda update-function-code --function-name motifspec-mcp --zip-file fileb://build/mcp.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name motifspec-mcp
      - name: Check the live server answers as this version
        if: steps.tagged.outputs.release
        env:
          WANT: ${{ steps.tagged.outputs.version }}
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}'
          got=""
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -sS -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$body" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result.serverInfo.version)}catch{console.log(s.slice(0,200))}})")
            if [ "$got" = "$WANT" ]; then echo "$URL serves MotifSpec $got."; exit 0; fi
            sleep 5
          done
          echo "::error title=MCP server::$URL answered \"$got\", expected version $WANT."
          exit 1

  pages:
    # Builds the release's docs site (site/, npm run docs) and publishes it as https://motifspec.com with GitHub Pages.
    # The custom domain is set in the repo's Pages settings and DNS is in Route 53. Run by hand, it publishes main's.
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # every file's history, for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hugo extended
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Build the site
        id: site
        run: |
          npm ci
          npm run docs
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -q "v$version" site/public/index.html || { echo "::error::The site doesn't name v$version."; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Check the live site shows this version
        env:
          WANT: v${{ steps.site.outputs.version }}
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" | grep -q "$WANT"; then echo "$URL shows MotifSpec $WANT."; exit 0; fi
            sleep 10
          done
          echo "::warning title=Docs site::$URL didn't show $WANT within a minute. Pages can take a little longer; check it by hand."
